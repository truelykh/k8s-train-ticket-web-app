apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-mongo
  namespace: train-ticket
  labels:
    app: ts-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ts-mongo
  template:
    metadata:
      labels:
        app: ts-mongo
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - wnode5
      containers:
        - name: ts-mongo
          image: mongo:4.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 27017
              name: port

          resources:
            requests:
              cpu: 60m
              memory: 200Mi
            limits:
              cpu: 300m
              memory: 350Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ts-mongo
  namespace: train-ticket
  labels:
    app: ts-mongo
spec:
  type: ClusterIP
  selector:
    app: ts-mongo
  ports:
    - name: port
      port: 27017
      targetPort: 27017
