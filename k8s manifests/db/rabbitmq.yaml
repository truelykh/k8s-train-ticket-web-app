apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: train-ticket
  labels:
    app: rabbitmq
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - wnode5
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5672
              name: port
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "rabbit"
            - name: RABBITMQ_DEFAULT_PASS
              value: "rabbit"
          resources:
            requests:
              cpu: 40m
              memory: 160Mi
            limits:
              cpu: 250m
              memory: 280Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: train-ticket
  labels:
    app: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: port
      port: 5672
      targetPort: 5672
