apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: train-ticket
  labels:
    app: nacos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - wnode5
      containers:
        - name: nacos
          image: nacos/nacos-server:v2.2.3-slim
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8848
              name: port
          env:
            - name: MODE
              value: "standalone"
            - name: NACOS_AUTH_ENABLE
              value: "false"
            - name: JVM_XMS
              value: "128m"
            - name: JVM_XMX
              value: "256m"
          resources:
            requests:
              cpu: 60m
              memory: 280Mi
            limits:
              cpu: 300m
              memory: 400Mi
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: train-ticket
  labels:
    app: nacos
spec:
  type: ClusterIP
  selector:
    app: nacos
  ports:
    - name: port
      port: 8848
      targetPort: 8848
