apiVersion: apps/v1
kind: Deployment
metadata:
  name: ts-ticket-office-service
  namespace: train-ticket
  labels:
    app: ts-ticket-office-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ts-ticket-office-service
  template:
    metadata:
      labels:
        app: ts-ticket-office-service
    spec:
      serviceAccountName: train-ticket-sa
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: workload
                    operator: In
                    values:
                      - wnode2
                      - wnode3
                      - wnode4
      containers:
        - name: ts-ticket-office-service
          image: nexus-svc.nexus.svc.cluster.local:8082/truelykh/ts-ticket-office-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 16108
              name: http
          env:
            - name: NACOS_ADDRS
              value: "nacos:8848"
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: JAVA_OPTS
              value: "-Xms32m -Xmx120m -XX:+UseSerialGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 20m
              memory: 120Mi
            limits:
              cpu: 150m
              memory: 190Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ts-ticket-office-service
  namespace: train-ticket
  labels:
    app: ts-ticket-office-service
spec:
  type: ClusterIP
  selector:
    app: ts-ticket-office-service
  ports:
    - name: http
      port: 16108
      targetPort: 16108
