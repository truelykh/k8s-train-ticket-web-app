apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: nexus
  name: nexus-sa

---
apiVersion: v1
kind: Pod
metadata:
  namespace: nexus
  name: nexus-pod
  labels:
    app: nexus-pod
spec:
  serviceAccountName: nexus-sa
  securityContext:
    fsGroup: 200
    fsGroupChangePolicy: OnRootMismatch
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - wnode1
  containers:
    - name: nexus-repo
      image: sonatype/nexus3:3.96.2
      ports:
        - containerPort: 8081
          name: nexus
        - containerPort: 8082
          name: docker
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 750m
          memory: 1.5Gi
      volumeMounts:
        - name: nexus-data
          mountPath: /nexus-data
  volumes:
    - name: nexus-data
      persistentVolumeClaim:
        claimName: nexus-pvc

---
apiVersion: v1
kind: Service
metadata:
  namespace: nexus
  name: nexus-svc
  labels:
    app: nexus-svc
spec:
  selector:
    app: nexus-pod
  type: NodePort
  ports:
    - name: nexus
      port: 8081
      targetPort: 8081
    - name: docker
      port: 8082
      targetPort: 8082

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: nexus
  name: nexus-pvc
  labels:
    app: nexus-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 20Gi
